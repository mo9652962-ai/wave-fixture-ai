name: Scorecard supply-chain security

# OpenSSF Scorecard：18 项供应链安全检查（Token 权限/Pinned 依赖/SAST/分支保护…）。
# push + 每周日定时扫描，publish_results: true → 结果发布到
# api.securityscorecards.dev（public repo），README badge 实时取分。
on:
  branch_protection_rule:
  schedule:
    - cron: "40 2 * * 0"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # SARIF 上传 code scanning
      id-token: write          # OIDC 发布到 Scorecard API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned to the *commit* the v2.4.2 tag points at. Pinning the annotated
      # tag object's own SHA instead makes Scorecard reject its own upload as an
      # "imposter commit" (the tag object is not part of the action's history).
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
