[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wave-fixture-ai"
version = "0.3.7"
description = "波峰焊治具 AI 设计助手：Gerber → 治具 DXF/STL/CNC G 代码 · 21 项自动化（沉板/狗骨头清角/拼版/避位/上锡/干涉分析/材料成本/生产工单）"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "mo9652962-ai" }]
keywords = ["wave-soldering", "fixture", "gerber", "dxf", "pcb", "eda", "manufacturing", "cad"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "shapely>=2.0",
    "ezdxf>=1.1",
    "trimesh>=4.0",
    "numpy>=1.24",
    "manifold3d>=0.7",
    "gerbonara>=1.4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "matplotlib>=3.8",  # DXF → PNG 预览渲染（cz 缺省未装会导致预览裂图）
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.8", "httpx>=0.27"]  # httpx: TestClient 依赖

[project.scripts]
wave-fixture-ai = "web_server:main"

[tool.setuptools]
py-modules = [
    "fixture_phase1",
    "fixture_phase2",
    "fixture_3d",
    "interference",
    "nl_adjust",
    "web_server",
    "ci_drc_gate",
    "drc",
    "golden",
    "review",
    "pin_select",
    "dogbone",
    "vertical_agent_toolkit",
    "materials",
    "panelize",
    "cnc_gcode",
    "report",
    "process",
    "batch_run",
    "equipment",
    "odb_parser",
    "top_hat",
    "selective_wave",
    "fixture_dimensioning",
    "wave_chamfer",
    "stiffener_bar",
    "gold_finger_mask",
    "lightening_pockets",
    "process_card",
    "thermal_profile",
    "barcode_tag",
    "solder_dam",
    "hold_down_clamps",
    "titanium_inserts",
    "cnc_toolpath_opt",
]

[tool.setuptools.data-files]
"share/wave-fixture-ai" = ["web/index.html"]

[project.urls]
Homepage = "https://github.com/mo9652962-ai/wave-fixture-ai"
Repository = "https://github.com/mo9652962-ai/wave-fixture-ai"
Issues = "https://github.com/mo9652962-ai/wave-fixture-ai/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E501: 行长由格式化负责；BLE001: 解析器对恶意/畸形输入必须容错不崩（except 已逐处审计）
ignore = ["E501", "BLE001"]

[tool.ruff.lint.per-file-ignores]
# FastAPI 的 File()/Form() 依赖注入模式必然在默认参数中调用工厂
"web_server.py" = ["B008"]
"tests/*" = ["S101"]
