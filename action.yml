name: 'Wave Fixture DRC'
description: '从 Gerber 自动生成波峰焊治具并跑 DRC 生产门禁——CI 中检查治具可制造性，产出 DXF 与报告。'
author: 'mo9652962-ai'

branding:
  icon: 'tool'
  color: 'orange'

inputs:
  gerber-dir:
    description: 'Gerber 文件目录（需含外形层 + .drl；建议含 B_Mask/F_Mask）'
    required: false
    default: '.'
  severity-threshold:
    description: '触发失败的严重度：info / warning / error / blocking（默认 error）'
    required: false
    default: 'error'
  version:
    description: 'wave-fixture-ai 的 PyPI 版本（显式锁定，防缓存漂移）'
    required: false
    default: '0.2.1'
  output-dir:
    description: '产物与报告输出目录'
    required: false
    default: 'fixture-out'
  upload-artifact:
    description: '是否上传 DXF/报告为 artifact'
    required: false
    default: 'true'

outputs:
  verdict:
    description: 'DRC 门禁结论：PASS / FAIL / INPUT_ERROR'
  exit-code:
    description: '门禁退出码（0 通过 / 1 未过 / 2 输入缺失）'
  report-path:
    description: 'DRC 报告 JSON 路径'

runs:
  using: 'composite'
  steps:
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

    - name: Install wave-fixture-ai
      shell: bash
      env:
        GFX_VERSION: ${{ inputs.version }}
      run: |
        uv venv .gfx-venv --quiet
        uv pip install --python .gfx-venv "wave-fixture-ai==$GFX_VERSION" --quiet
        # 记录解释器路径（Windows: Scripts/，Unix: bin/）
        if [ -x .gfx-venv/bin/python ]; then echo "GFX_PY=$PWD/.gfx-venv/bin/python" >> "$GITHUB_ENV";
        else echo "GFX_PY=$PWD/.gfx-venv/Scripts/python.exe" >> "$GITHUB_ENV"; fi

    - name: Generate fixture & run DRC gate
      id: drc
      shell: bash
      env:
        GFX_GERBER: ${{ inputs.gerber-dir }}
        GFX_OUT: ${{ inputs.output-dir }}
        GFX_THRESHOLD: ${{ inputs.severity-threshold }}
      run: |
        set +e
        "$GFX_PY" -m ci_drc_gate "$GFX_GERBER" --out "$GFX_OUT" --severity-threshold "$GFX_THRESHOLD"
        RC=$?
        set -e
        echo "exit-code=$RC" >> "$GITHUB_OUTPUT"
        echo "report-path=$GFX_OUT/drc-report.json" >> "$GITHUB_OUTPUT"
        if [ "$RC" = "0" ]; then echo "verdict=PASS" >> "$GITHUB_OUTPUT"; else echo "verdict=FAIL" >> "$GITHUB_OUTPUT"; fi
        exit 0   # 门禁结论交由下一步处理，保证产物先上传

    - name: Upload fixture artifacts
      if: ${{ inputs.upload-artifact == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.4.3（SHA 固定）
      with:
        name: fixture-artifacts
        path: ${{ inputs.output-dir }}
        if-no-files-found: ignore

    - name: Enforce DRC gate
      if: steps.drc.outputs.exit-code != '0'
      shell: bash
      run: |
        echo "::error::治具 DRC 门禁未通过（阈值 ${{ inputs.severity-threshold }}）— 报告: ${{ steps.drc.outputs.report-path }}"
        exit 1
